spring.application.name=payment-service

# Kafka ba?lant?s? (Docker-d?ki kafka, host-dan localhost:9092)
spring.kafka.bootstrap-servers=localhost:9092

# order-db (Docker, port 5433)
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5434/paymentdb
spring.datasource.username=payment
spring.datasource.password=payment
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.properties.schema.registry.url=http://localhost:8085
spring.kafka.properties.specific.avro.reader=true