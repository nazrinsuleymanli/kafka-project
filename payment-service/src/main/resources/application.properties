spring.application.name=payment-service

# Kafka ba?lant?s? (Docker-d?ki kafka, host-dan localhost:9092)
spring.kafka.bootstrap-servers=localhost:9092

# order-db (Docker, port 5433)
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5434/paymentdb
spring.datasource.username=payment
spring.datasource.password=payment
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.kafka.payment_service.event.OrderCreatedEvent