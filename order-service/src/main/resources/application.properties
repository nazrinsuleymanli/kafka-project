spring.application.name=order-service
# Kafka ba?lant?s? (Docker-d?ki kafka, host-dan localhost:9092)
spring.kafka.bootstrap-servers=localhost:9092

# order-db (Docker, port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/orderdb
spring.datasource.username=order
spring.datasource.password=order
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.properties.schema.registry.url=http://localhost:8085